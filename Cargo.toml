[workspace]
resolver = "2"
members = ["crates/flelink-core", "crates/flelink-api", "crates/flelink"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# hashing is the slow part of checking a 248 GB model; size optimisation halves its speed
[profile.release.package.sha2]
opt-level = 3
