name: release

# Tag vX.Y.Z builds (a tag with a dash, vX.Y.Z-rc.N, is a pre-release: install.sh and the updater skip it) `flelink` for macOS (arm64, x64), Linux (x64) and Windows (x64) and attaches the files plus the installers.
on:
  push: { tags: ["v*"] }

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }   # cross-compiled: the Intel macOS images are gone
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p flelink --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release && tar -czf "$GITHUB_WORKSPACE/flelink-${{ matrix.target }}.tar.gz" flelink fle && cd "$GITHUB_WORKSPACE"
          (shasum -a 256 flelink-${{ matrix.target }}.tar.gz 2>/dev/null || sha256sum flelink-${{ matrix.target }}.tar.gz) | awk '{print $1"  flelink-${{ matrix.target }}.tar.gz"}' > flelink-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/flelink.exe,target/${{ matrix.target }}/release/fle.exe -DestinationPath flelink-${{ matrix.target }}.zip
          $h = (Get-FileHash flelink-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  flelink-${{ matrix.target }}.zip" | Out-File -Encoding ascii flelink-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with: { name: "flelink-${{ matrix.target }}", path: "flelink-${{ matrix.target }}.*" }
  app:
    # the desktop app (Tauri), unsigned for now: macOS asks to confirm the first start, Windows shows SmartScreen
    strategy:
      matrix:
        include:
          - { os: macos-latest,   args: "--target aarch64-apple-darwin" }
          - { os: macos-latest,   args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-latest,  args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tauriScript: npx -y @tauri-apps/cli@2
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "FLE Link ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  publish:
    # after the app jobs too: SHA256SUMS below covers their installers, which install.sh and install.ps1 check
    needs: [build, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cp install.sh install.ps1 dist/
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", prerelease: "${{ contains(github.ref_name, '-') }}", name: "FLE Link ${{ github.ref_name }}" }
      - name: SHA256SUMS over every file of the release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir all
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" -D all
          rm -f all/SHA256SUMS
          (cd all && sha256sum * > ../SHA256SUMS)
          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber -R "${{ github.repository }}"
