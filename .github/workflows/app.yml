name: app

# The desktop app (app/, Tauri) builds on all three systems. Separate from `ci` so the CLI and server never wait for a web view.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Also build the installers, on these systems (JSON list, e.g. ["ubuntu-latest","windows-latest"]); empty: none'
        default: ""
  push: { paths: ["app/**", "crates/flelink-api/**", "crates/flelink-core/**", "web/**", ".github/workflows/app.yml"] }
  pull_request: { paths: ["app/**", "crates/flelink-api/**", "crates/flelink-core/**", "web/**", ".github/workflows/app.yml"] }

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # private repository = paid minutes (macOS counts ten times, Windows twice): a push runs Linux only, a pull request, a tag or
      # a manual run runs all three
      matrix: { os: "${{ (github.event_name == 'push' && github.ref_type == 'branch') && fromJSON('[\"ubuntu-latest\"]') || fromJSON('[\"ubuntu-latest\",\"macos-latest\",\"windows-latest\"]') }}" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "app" }
      - run: cargo clippy -- -D warnings
        working-directory: app
      - run: cargo build --release
        working-directory: app

  # the installers without a release, to try them before a tag: a manual run with "bundle" set, on the systems named there
  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.bundle != ''
    strategy:
      fail-fast: false
      matrix: { os: "${{ fromJSON(inputs.bundle) }}" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "app" }
      - run: npx -y @tauri-apps/cli@2 build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: "app-${{ matrix.os }}"
          path: |
            app/target/release/bundle/**/*.dmg
            app/target/release/bundle/**/*.msi
            app/target/release/bundle/**/*-setup.exe
            app/target/release/bundle/**/*.AppImage
            app/target/release/bundle/**/*.deb
          retention-days: 7
