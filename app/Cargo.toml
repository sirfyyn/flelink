# The desktop app. Its own workspace on purpose: the main workspace (CLI, server, tests, CI on three systems) must not need a
# web view or the Linux system libraries that go with it.
[workspace]

[package]
name = "flelink-app"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "FLE Link, the desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# the system's own folder picker for "Add folder" (only the open dialog is allowed, see capabilities/default.json)
tauri-plugin-dialog = "2"
flelink-api = { path = "../crates/flelink-api" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Windows: the app puts itself in a job object that kills every child (the engine) when the app ends, however it ends.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
