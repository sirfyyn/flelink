[package]
name = "flelink"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flelink"
path = "src/main.rs"

# the short name: the same program under a second name
[[bin]]
name = "fle"
path = "src/main.rs"

[dependencies]
flelink-core = { path = "../flelink-core" }
flelink-api = { path = "../flelink-api" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde_json = { version = "1", features = ["preserve_order"] }
