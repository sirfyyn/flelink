[package]
name = "flelink"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flelink"
path = "src/main.rs"

# the short name `fle` is src/bin/fle.rs: the same program under a second name
[[bin]]
name = "fle"
path = "src/bin/fle.rs"

[dependencies]
flelink-core = { path = "../flelink-core" }
flelink-api = { path = "../flelink-api" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde_json = { version = "1", features = ["preserve_order"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
libc = "0.2"
