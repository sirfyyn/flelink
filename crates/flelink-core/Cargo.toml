[package]
name = "flelink-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
minisign-verify = "0.3"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "5"
toml = "0.8"

[target."cfg(unix)".dependencies]
libc = "0.2"

# SHA-256 of model files (downloads, files found elsewhere): on ARM the hardware instructions through the asm backend,
# 2.2 GB/s instead of 0.2 GB/s on an M2 (it does not build with MSVC, so not on Windows; x86 finds SHA-NI by itself)
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
