id = "deepseek-v41-ista-iq1m"
title = "DeepSeek-V4.1-Flash ISTA IQ1_M (FLE, the fast way, less exact)"
note = "A smaller quant for speed: 42.3 tok/s decode on one 32 GB GPU with 120 GB RAM (n=6, 39.1 to 45.6; 3 Nov 2026, before the prefill windows), with the expert-cache bonus on every layer and 80 GB of hot experts locked in RAM. It answers less exactly than IQ2_XXS (KL divergence about 0.13 against it): for speed, not for quality. Needs FLE v1.2.4, permission to lock memory and about 225 GB on a fast NVMe."

[model]
repo = "ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF"
files = [
  "DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M-00001-of-00006.gguf",
  "DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M-00002-of-00006.gguf",
  "DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M-00003-of-00006.gguf",
  "DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M-00004-of-00006.gguf",
  "DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M-00005-of-00006.gguf",
  "DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf",
]
size = 231316485152

[model.save_as]
