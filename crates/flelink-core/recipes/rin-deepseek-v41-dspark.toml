id = "rin-deepseek-v41-dspark"
title = "Rin - Deepseek V4.1 Flash 1017 + DSpark (FLE)"
note = "Rin is a 2-bit DeepSeek V4.1 Flash (763 B parameters) built from ISTA DASLab's GSQ-RCO quants and split into a hot half (resident on the GPU) and a cold half (served from RAM) along a usage profile, with FLE's DSpark draft model. About 53 tok/s decode on one 32 GB GPU with 120 GB RAM (FLE v1.2.6, 5 Nov 2026). Lossy: a bit worse than the ISTA IQ2_XXS it is made from, see the model card. Needs FLE v1.2.6 or newer and about 260 GB on a fast NVMe. Leave a few seconds between two starts: the GPU memory has to be free first."

[model]
repo = "sirfyyn/Rin-Deepseek-V4.1-Flash-1017-GGUF"
files = [
  "Rin-Deepseek-V4.1-Flash-1017-00001-of-00006.gguf",
  "Rin-Deepseek-V4.1-Flash-1017-00002-of-00006.gguf",
  "Rin-Deepseek-V4.1-Flash-1017-00003-of-00006.gguf",
  "Rin-Deepseek-V4.1-Flash-1017-00004-of-00006.gguf",
  "Rin-Deepseek-V4.1-Flash-1017-00005-of-00006.gguf",
  "Rin-Deepseek-V4.1-Flash-1017-00006-of-00006.gguf",
]
# sum of the six parts as written on Titan (5 Nov 2026); re-check against the final upload
size = 237857494656

[model.sha256]
# TODO before release: from /mnt/perf/forge/rin-sha256.txt (Titan)

[draft]
repo = "sirfyyn/Rin-Deepseek-V4.1-Flash-1017-GGUF"
file = "FLE-DSpark-V4.1-1017-Q2K-Q8.gguf"
sha256 = "c223adafb9aa0e125557907165f54c555f3fa576918f9561979136bca8822482"
size = 5216519072

[engine]
prefer = ["fle"]
strict = true
# v1.2.6: split hot/cold tensors (fle.expert_split.*), /fle/status, start errors with a reason
min_version = "v1.2.6"

[run]
context = 16384
# the usage profile that decided the hot/cold split: copied to {profile} on the first start (the store's warm start needs it)
profile_file = "fle-usage-profile-ista-iq2_xxs.prof"
# -t: physical cores only (SMT threads made it much slower)
# No FLE_MOE_CACHE_BUDGET_MIB / _FIT: the hot half is already resident on the GPU, a cache budget on top runs out of memory.
args = [
  "--jinja", "-ngl", "99", "-cmoe", "-t", "{physical_cores}", "-ctk", "q8_0", "-ctv", "q8_0",
  "-fit", "on", "--fit-target", "1115", "--moe-expert-cache-inserts", "0",
  "-md", "{draft}", "-ngld", "99", "--spec-type", "draft-dspark", "--spec-draft-p-min", "0.7", "--spec-draft-n-max", "5", "-b", "4096", "-ub", "4096",
]

unset_env = ["FLE_MOE_ADMIT_FREQ", "FLE_MOE_EVICT_OLDEST", "FLE_MOE_OBS_MAXTOK", "FLE_MOE_PROFILE_SAVE_SEC", "FLE_MOE_CACHE_BIAS",
  "FLE_CKPT_TAIL", "FLE_MTP_VOCAB_N", "FLE_MTP_PENALTIES", "FLE_SLOT_EARLY_SAVE", "FLE_CACHE_GUARD_SLOT",
  "FLE_MOE_CACHE_BUDGET_MIB", "FLE_MOE_CACHE_BUDGET_FIT"]
ready_log = "[fle-store] warm start"

[run.env]
FLE_HC_FUSED = "1"
FLE_MC_OVERLAP = "1"
FLE_MMAP_NO_RANDOM = "1"
FLE_DRAFT_UBATCH = "512"
FLE_MOE_FUSED_CPU = "1"
FLE_MOE_POOL = "1"
# the profile is needed for the store warm start (without it Rin ran at 30.9 tok/s)
FLE_MOE_PROFILE = "{profile}"
FLE_MOE_PROFILE_READONLY = "1"   # the profile is read, never rewritten: the same start gives the same answer
FLE_MOE_STORE_ASYNC = "1"
FLE_MOE_STORE_GB = "90"
FLE_MOE_STORE_UPLOAD = "1"
FLE_MOE_WILLNEED_NOW = "1"
FLE_PREFILL_LEAN = "1"
FLE_PREFILL_WINDOW = "8"
FLE_PREFILL_WINDOW_MAX = "2047"
FLE_SCHED_ASYNC_CPU = "1"
FLE_UBATCH_LEND = "1"
FLE_UBATCH_PREFETCH = "1"
FLE_UBATCH_PREFETCH_SLOTS = "3"

# where it was measured, not a determined minimum
[requires]
ram_gib = 120
vram_gib = 32

[chat]
thinking = false
