id = "kate-27b-dspine"
title = "Kate - Qwen 27B - GGUF - SpedUp - Abliterated (FLE, IQ4_XS + DSpine)"
# PENDING (Release 2026-11): Zahlen erst nach den Messungen auf der geheilten Kate eintragen (KLD, Tempo, kleinste Karte).
note = "Kate is Katy (Swift-1.5-Qwen3.8-27B) with the refusal direction removed from the weights, as an IQ4_XS quant whose block scales were healed against its own BF16 (same size and format). It no longer refuses requests the original refused for safety reasons: you are responsible for what you do with it. Decode PENDING tok/s on one 32 GB RTX PRO 4500 with the DSpine draft (FLE, PENDING date). Licence: Swift Open License v1.0, the DSpine head Apache-2.0, see the model page."

[model]
repo = "sirfyyn/Kate-Qwen-27B-GGUF-SpedUp-Abliterated"
files = ["kate-27b-IQ4_XS-imat.gguf"]
# PENDING: Groesse und sha256 der geheilten Datei aus der Upload-Liste (SHA256SUMS)
size = 0

[model.sha256]
"kate-27b-IQ4_XS-imat.gguf" = "PENDING"

[draft]
repo = "sirfyyn/Kate-Qwen-27B-GGUF-SpedUp-Abliterated"
file = "Qwen3.8-27B-DSpine-b16-Q4_K_M.gguf"
# unchanged tencent/Qwen3.8-27B-DSpine-b16 as GGUF Q4_K_M (sha256 gemessen 14.11.2026 auf Titan)
sha256 = "0c6c984ac18611288d7b8f497bc347c4921e8231b1b6abf28650481eaf35ff55"
size = 1257892896

[engine]
prefer = ["fle"]
strict = true
# PENDING: erste oeffentliche FLE-Version mit DSpine (draft-dflash mit dem DSpine-Kopf); bis dahin nicht veroeffentlichen
min_version = "PENDING"

[run]
context = 32768
# wie Katy: -ngl auto, Platz fuer den Entwurfskopf frei halten; n-max 15 wie im eigenen Betrieb (DSpine Block 16)
args = [
  "--jinja", "-ngl", "auto", "-t", "{physical_cores_up_to_8}", "-fa", "on", "--parallel", "1", "-ctk", "q8_0", "-ctv", "q8_0",
  "-fit", "on", "--fit-target", "2400",
  "-md", "{draft}", "--spec-draft-ngl", "all", "--spec-type", "draft-dflash,ngram-mod", "--spec-draft-p-min", "0", "--spec-draft-n-max", "15",
  "--spec-ngram-mod-n-min", "8", "--spec-ngram-mod-n-max", "32", "--spec-ngram-mod-n-match", "16",
  "--temp", "1.0", "--top-p", "0.95", "--top-k", "20", "--min-p", "0",
]

# PENDING: kleinste gemessene Kartengroesse (wie bei Katy durch Speichergrenze auf der 32-GB-Karte simulieren)
[requires]
ram_gib = 24
vram_gib = 32
vram_is_minimum = true
