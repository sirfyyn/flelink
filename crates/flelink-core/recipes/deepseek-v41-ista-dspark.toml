[draft]
repo = "sirfyyn/DeepSeek-V4.1-Flash-1017-DSpark-FLE-GGUF"
file = "FLE-DSpark-V4.1-1017-Q2K-Q8.gguf"
sha256 = "c223adafb9aa0e125557907165f54c555f3fa576918f9561979136bca8822482"
size = 5216519072


[engine]
prefer = ["fle"]
strict = true
# v1.2.4: RAM expert store (FLE_MOE_STORE_*), pool, prefill windows; exact (no cache bonus: with the store it costs speed)
min_version = "v1.2.4"

[run]
context = 16384
# -t: physical cores only (SMT threads made it much slower)
args = [
  "--jinja", "-ngl", "99", "-cmoe", "-t", "{physical_cores}", "-ctk", "q8_0", "-ctv", "q8_0",
  "-fit", "on", "--fit-target", "1115", "--moe-expert-cache-inserts", "1",
  "-md", "{draft}", "-ngld", "99", "--spec-type", "draft-dspark", "--spec-draft-p-min", "0.7", "-b", "4096", "-ub", "4096",
]

unset_env = ["FLE_MOE_ADMIT_FREQ", "FLE_MOE_EVICT_OLDEST", "FLE_MOE_OBS_MAXTOK", "FLE_MOE_PROFILE_SAVE_SEC", "FLE_MOE_CACHE_BIAS",
  "FLE_CKPT_TAIL", "FLE_MTP_VOCAB_N", "FLE_MTP_PENALTIES", "FLE_SLOT_EARLY_SAVE", "FLE_CACHE_GUARD_SLOT"]
ready_log = "[fle-store] warm start"

[run.env]
FLE_HC_FUSED = "1"
FLE_MC_OVERLAP = "1"
FLE_MMAP_NO_RANDOM = "1"
FLE_MOE_CACHE_BUDGET_FIT = "1"
FLE_MOE_CACHE_BUDGET_MIB = "15000"
FLE_MOE_FUSED_CPU = "1"
FLE_MOE_POOL = "1"
FLE_MOE_PROFILE = "{profile}"
FLE_MOE_STORE_ASYNC = "1"
FLE_MOE_STORE_GB = "90"
FLE_MOE_STORE_UPLOAD = "1"
FLE_MOE_WILLNEED_NOW = "1"
FLE_PREFILL_LEAN = "1"
FLE_PREFILL_WINDOW = "16"
FLE_PREFILL_WINDOW_MAX = "2047"
FLE_SCHED_ASYNC_CPU = "1"
FLE_UBATCH_LEND = "1"
FLE_UBATCH_PREFETCH = "1"
FLE_UBATCH_PREFETCH_SLOTS = "3"

# where it was measured, not a determined minimum
[requires]
ram_gib = 120
vram_gib = 32

[chat]
thinking = false
