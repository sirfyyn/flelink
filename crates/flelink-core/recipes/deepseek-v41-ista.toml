[engine]
prefer = ["fle"]
strict = true
# CACHE_BIAS_LAYERS and SCHED_ASYNC_CPU are new in v1.2.3, which also serves two requests at once without the q8_0 abort
min_version = "v1.2.3"

[run]
context = 16384
# -t: physical cores only (SMT threads made it much slower)
args = [
  "--jinja", "-ngl", "99", "-cmoe", "-t", "{physical_cores}", "-ctk", "q8_0", "-ctv", "q8_0",
  "-fit", "on", "--fit-target", "1115", "--moe-expert-cache-inserts", "1", "-b", "4096", "-ub", "4096",
]

[run.env]
FLE_MOE_CACHE_BUDGET_FIT = "1"
FLE_MOE_CACHE_BUDGET_MIB = "22000"
FLE_MOE_PROFILE = "{profile}"
FLE_MOE_HOT_MLOCK_GB = "{hot_mlock_gb}"
FLE_MMAP_NO_RANDOM = "1"
FLE_MOE_WILLNEED_NOW = "1"
FLE_MC_OVERLAP = "1"
# the cache bonus only on the layers after 14 (Procyon E4, 2 Nov 2026: KL +0.003 over the noise); the CPU side scheduled
# asynchronously
FLE_MOE_CACHE_BIAS = "0.1"
FLE_MOE_CACHE_BIAS_LAYERS = "0-14:0"
FLE_SCHED_ASYNC_CPU = "1"
FLE_UBATCH_LEND = "1"
FLE_UBATCH_PREFETCH = "1"
FLE_UBATCH_PREFETCH_SLOTS = "3"
FLE_PREFILL_LEAN = "1"
FLE_HC_FUSED = "1"

# where it was measured, not a determined minimum
[requires]
ram_gib = 120
vram_gib = 32

