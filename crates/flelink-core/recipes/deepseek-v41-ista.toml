id = "deepseek-v41-ista"
title = "DeepSeek-V4.1-Flash ISTA IQ2_XXS (FLE, hot experts in RAM)"
note = "On one 32 GB GPU with 120 GB RAM (RTX PRO 4500), on three tasks the expert profile has not seen, after a warm-up: 29.3 tok/s through FLE Link with the earlier settings on FLE v1.2.2; these settings measured 29.7 to 31.7 tok/s on the FLE engine (2 Nov 2026). ISTA's GSQ-RCO quant with FLE's host-side expert settings: a 22 GB GPU expert cache, the hot experts locked in RAM (memory minus 60 GiB, at most 75) after a profile from the first run, and large batches. Needs FLE v1.2.3 or newer and permission to lock memory (FLE Link says so in the engine log when the system does not allow it). The expert cache bonus (0.1, only after layer 14) changes the output a little (KL divergence +0.003 over the noise); set FLE_MOE_CACHE_BIAS to 0 for the exact output (26.8 tok/s). No draft model: with this cache it does not help any more. About 255 GB on a fast NVMe."

