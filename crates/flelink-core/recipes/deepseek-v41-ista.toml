[engine]
prefer = ["fle"]
strict = true

[run]
context = 16384
# -t: physical cores only (SMT threads made it much slower)
# -np 1: one slot. FLE v1.2.2 aborts (ggml_cuda_cpy q8_0 to q8_0) when two requests share the q8_0 KV cache at once, for
# example the agent and the chat; with one slot the second request waits instead. The next engine release fixes it.
args = [
  "--jinja", "-ngl", "99", "-cmoe", "-t", "{physical_cores}", "-ctk", "q8_0", "-ctv", "q8_0", "-np", "1",
  "-fit", "on", "--fit-target", "1115", "--moe-expert-cache-inserts", "1", "-b", "4096", "-ub", "4096",
]

[run.env]
FLE_MOE_CACHE_BUDGET_FIT = "1"
FLE_MOE_CACHE_BUDGET_MIB = "22000"
FLE_MOE_PROFILE = "{profile}"
FLE_MOE_HOT_MLOCK_GB = "{hot_mlock_gb}"
FLE_MMAP_NO_RANDOM = "1"
FLE_MOE_WILLNEED_NOW = "1"
FLE_MC_OVERLAP = "1"
FLE_MOE_CACHE_BIAS = "0.05"
FLE_MOE_HOT_BIAS = "0.02"
FLE_UBATCH_LEND = "1"
FLE_UBATCH_PREFETCH = "1"
FLE_UBATCH_PREFETCH_SLOTS = "3"
FLE_PREFILL_LEAN = "1"
FLE_HC_FUSED = "1"

# where it was measured, not a determined minimum
[requires]
ram_gib = 120
vram_gib = 32

[chat]
thinking = false
