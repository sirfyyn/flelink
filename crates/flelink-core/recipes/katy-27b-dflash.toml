id = "katy-27b-dflash"
title = "Katy 27B IQ4_XS + DFlash2 (FLE, for a 12 to 32 GB GPU)"
note = "A dense 27B model with the DFlash2 draft. From 20 GB of GPU memory all 66 layers fit; below that the rest runs on the CPU. Decode at context 32768: 104 tok/s from 20 GB up, 19.4 at 16 GB (51 layers), 13.3 at 14 GB (42), 11.2 at 12 GB (33). One run each, Nov 2026, on the engine directly, not through FLE Link. Measured on a Ryzen 9 9950X3D with 120 GB RAM, 8 threads, on a 32 GB card (20 GB and up) and a 16 GB card, with the memory limited to simulate each size; a slower CPU or RAM will be slower below 20 GB. Licence: Swift Open License v1.0, see the model page."

[model]
repo = "sirfyyn/Katy-27B-GGUF"
files = ["katy-27b-IQ4_XS-imat.gguf"]
size = 15309039680

[model.sha256]
"katy-27b-IQ4_XS-imat.gguf" = "ba316d148400fcdc9f9d7426d4656e72ce478ee04b0ff7336ba0618cac860497"

[draft]
repo = "sirfyyn/Katy-27B-GGUF"
file = "dflash2-katy-q8_0.gguf"
sha256 = "3ae04e8e161999021b23f11d1761a8a18b561bb6d41335940a59c6b40720c676"
size = 2056414112

[engine]
prefer = ["fle"]
strict = true
min_version = "v1.2.6"

[run]
context = 32768
# -ngl auto overrides the plan's 99: with 99 the card fills up and the draft fails with out of memory.
# --fit-target 3100: up to v1.2.6 the fit cannot measure a DFlash head, so the room for it (2 GB and its buffers) is kept free.
# -t: every run so far had 8 threads
args = [
  "--jinja", "-ngl", "auto", "-t", "{physical_cores_up_to_8}", "-fa", "on", "--parallel", "1", "-ctk", "q8_0", "-ctv", "q8_0",
  "-fit", "on", "--fit-target", "3100",
  "-md", "{draft}", "--spec-draft-ngl", "all", "--spec-type", "draft-dflash,ngram-mod", "--spec-draft-p-min", "0", "--spec-draft-n-max", "5",
  "--spec-ngram-mod-n-min", "8", "--spec-ngram-mod-n-max", "32", "--spec-ngram-mod-n-match", "16",
]

# vram: the smallest size offered (measured, simulated on a 16 GB card)
# ram: not measured; the 15 GB file and the 2 GB draft have to fit next to the system on a card that holds only part of them
[requires]
ram_gib = 24
vram_gib = 12
vram_is_minimum = true
